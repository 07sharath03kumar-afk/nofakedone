name: nofakedone
description: Fail a pull request whose diff hides fake "done" (stubs, disabled tests, tautological asserts, swallowed errors, bypassed checks).
branding:
  icon: shield
  color: red
inputs:
  base:
    description: Git ref to compare against
    default: origin/${{ github.base_ref || 'main' }}
  strict:
    description: Treat warnings as failures
    default: "false"
runs:
  using: composite
  steps:
    - shell: bash
      run: |
        args="--base ${{ inputs.base }}"
        if [ "${{ inputs.strict }}" = "true" ]; then args="$args --strict"; fi
        python3 "${{ github.action_path }}/scripts/nofakedone.py" $args
